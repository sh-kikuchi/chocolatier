openapi: 3.0.3
info:
  title: Chocolatier API
  version: 2.0.0
  description: |
    Django REST Framework + SimpleJWT の API。

    ## 認証（改修案件1）
    - JWT は **HttpOnly Cookie**（`access_token` / `refresh_token`）でやり取りする。レスポンス本文にトークンは含まれない。
    - ブラウザ（フロント）は `withCredentials: true` で Cookie を自動送信する。
    - 更新系（POST / PUT / PATCH / DELETE）は、`csrftoken` Cookie の値を **`X-CSRFToken` ヘッダー**にも付ける（CSRF 対策）。
      先に `GET /csrf/` を呼んで `csrftoken` を受け取っておく。
    - 特に記載のない API はログイン必須。未ログインや期限切れは 401。
      access_token が切れたら `POST /token/refresh/` で取り直す。

    ## 権限
    - Snap は **自分の投稿だけ** を扱える。他人の Snap の ID を指定すると 404。
    - サインアップは **管理者（is_staff）だけ** が使える（改修案件2）。

    ## 入力チェック（改修案件2）
    - 画像：jpg / jpeg / png / gif / webp、5MB 以下、中身が画像であること
    - コメント：1000 文字以内
    - エラーは `{フィールド名: [メッセージ, ...]}` の形で、日本語のメッセージを返す。

    ## 詳しい解説
    - docs/03_articles/07_cookieAuth.md（認証・curl / Postman での呼び方）
    - docs/03_articles/08_validation.md（入力チェック）

servers:
  - url: http://localhost:8000

tags:
  - name: Auth
    description: 認証関連の API
  - name: User
    description: ユーザー関連の API
  - name: Snap
    description: Snap 関連の API

# 特に記載のない API はログイン必須（access_token Cookie）
security:
  - cookieAuth: []

paths:
  # =========================================================
  # Auth
  # =========================================================
  /csrf/:
    get:
      tags: [Auth]
      summary: CSRF トークン発行
      description: |
        `csrftoken` Cookie を発行する。フロントは起動時に呼ぶ。
        以降の更新系リクエストでは、この値を `X-CSRFToken` ヘッダーに付ける。
      security: []
      responses:
        "200":
          description: csrftoken Cookie が発行された
          headers:
            Set-Cookie:
              description: "`csrftoken=...`（HttpOnly ではないので JS から読める）"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: CSRF cookie set

  /token/:
    post:
      tags: [Auth]
      summary: ログイン
      description: |
        ユーザー名とパスワードで認証し、`access_token`（60分）と `refresh_token`（1日）を
        HttpOnly Cookie にセットする。レスポンス本文にトークンは含まれない。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: alice
                password:
                  type: string
                  format: password
                  example: your-secret-password
      responses:
        "200":
          description: ログイン成功
          headers:
            Set-Cookie:
              description: "`access_token=...; HttpOnly; SameSite=Lax` と `refresh_token=...; HttpOnly; SameSite=Lax`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: ログインしました
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          description: ユーザー名またはパスワードが違う（どちらが違うかは返さない）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              example:
                detail: ユーザー名またはパスワードが違います

  /token/refresh/:
    post:
      tags: [Auth]
      summary: アクセストークン更新
      description: |
        `refresh_token` Cookie を使って新しい `access_token` を発行し、Cookie を更新する。
        リクエスト本文は不要。フロントは API が 401 を返したときに自動で呼ぶ。
      security:
        - refreshCookie: []
      responses:
        "200":
          description: access_token Cookie が更新された
          headers:
            Set-Cookie:
              description: "`access_token=...; HttpOnly; SameSite=Lax`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: トークンを更新しました
        "401":
          description: refresh_token がない、または期限切れ・不正（再ログインが必要）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                missing:
                  value:
                    detail: refresh token がありません
                invalid:
                  value:
                    detail: refresh token が無効です

  /logout/:
    post:
      tags: [Auth]
      summary: ログアウト
      description: |
        `access_token` / `refresh_token` Cookie を削除する。
        HttpOnly Cookie は JS から消せないため、サーバーが消す。未ログインでも呼べる。
      security: []
      responses:
        "200":
          description: Cookie が削除された
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: ログアウトしました

  # =========================================================
  # User
  # =========================================================
  /chocolatier_api/user-info/:
    get:
      tags: [User]
      summary: ログイン中のユーザー情報
      description: フロントは起動時とログイン直後に呼び、ログイン中かどうかを判断する。
      responses:
        "200":
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /chocolatier_api/signup/:
    post:
      tags: [User]
      summary: ユーザー登録（管理者のみ）
      description: |
        新しい一般ユーザー（is_staff=False）を作成する。サインアップ画面はなく、
        運用で Postman などから呼ぶ。**管理者でログインしている必要がある**。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  example: bob
                email:
                  type: string
                  format: email
                  example: bob@example.com
                password:
                  type: string
                  format: password
                  example: your-secret-password
      responses:
        "201":
          description: ユーザーが作成された
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: ユーザー登録が完了しました
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: 管理者ではない、または CSRF トークンがない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                notAdmin:
                  value:
                    detail: このアクションを実行する権限がありません。
                csrf:
                  value:
                    detail: "CSRF Failed: CSRF token missing."

  # =========================================================
  # Snap
  # =========================================================
  /chocolatier_api/snap/:
    get:
      tags: [Snap]
      summary: Snap 一覧
      description: ログインユーザー自身の Snap を、新しい順（created_at の降順）で返す。
      responses:
        "200":
          description: Snap 一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Snap'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /chocolatier_api/snap/create/:
    post:
      tags: [Snap]
      summary: Snap 登録
      description: |
        画像をアップロードして Snap を作成する。投稿者はサーバー側でログインユーザーに設定する
        （`user` を送っても無視される）。画像は `media/uploads/` に保存される。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [upload]
              properties:
                upload:
                  type: string
                  format: binary
                  description: 画像ファイル（jpg / jpeg / png / gif / webp、5MB 以下）
                comment:
                  type: string
                  maxLength: 1000
                  example: 思い出の一枚
      responses:
        "201":
          description: Snap が作成された
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapCreated'
        "400":
          description: 入力値エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              examples:
                tooLarge:
                  summary: 5MB を超える
                  value:
                    upload: [画像サイズは5MB以下にしてください]
                notImage:
                  summary: 中身が画像ではない
                  value:
                    upload: [有効な画像をアップロードしてください。アップロードされたファイルは画像でないか、壊れた画像です。]
                extension:
                  summary: 許可されていない拡張子
                  value:
                    upload: [ファイル拡張子 “bmp” は許可されていません。許可されている拡張子は jpg, jpeg, png, gif, webp です。]
                commentTooLong:
                  summary: コメントが 1000 文字を超える
                  value:
                    comment: [この項目は1000文字より長くならないようにしてください。]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CsrfFailed'

  /chocolatier_api/snap/{id}/:
    parameters:
      - $ref: '#/components/parameters/SnapId'
    get:
      tags: [Snap]
      summary: Snap 詳細
      responses:
        "200":
          description: Snap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snap'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Snap]
      summary: Snap 更新（コメントのみ）
      description: コメントだけを更新する。画像は変更できない。PUT も同じ動きをする。
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 1000
                  example: コメントを更新しました
      responses:
        "200":
          description: 更新後のコメント
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment:
                    type: string
                    example: コメントを更新しました
        "400":
          description: 入力値エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
              example:
                comment: [この項目は1000文字より長くならないようにしてください。]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CsrfFailed'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Snap]
      summary: Snap 削除
      description: Snap と、紐づく画像ファイル（DB と実ファイル）を削除する。
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: 削除された
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CsrfFailed'
        "404":
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: ログイン（POST /token/）でセットされる HttpOnly Cookie
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: ログイン（POST /token/）でセットされる HttpOnly Cookie
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: "`csrftoken` Cookie（GET /csrf/ で発行）と同じ値を付ける。更新系で必須"

  parameters:
    SnapId:
      in: path
      name: id
      required: true
      description: Snap の ID（自分の Snap のみ。他人の ID は 404）
      schema:
        type: integer
        example: 1

  responses:
    Unauthorized:
      description: 未ログイン、または access_token が期限切れ・不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Detail'
          example:
            detail: 認証情報が含まれていません。
    CsrfFailed:
      description: X-CSRFToken ヘッダーがない、または値が一致しない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Detail'
          example:
            detail: "CSRF Failed: CSRF token missing."
    NotFound:
      description: Snap が存在しない、または他人の Snap（どちらも同じレスポンス）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Detail'
          example:
            detail: No Snap matches the given query.
    ValidationError:
      description: 入力値エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrors'

  schemas:
    Message:
      type: object
      properties:
        message:
          type: string

    Detail:
      type: object
      properties:
        detail:
          type: string

    ValidationErrors:
      type: object
      description: フィールド名ごとのエラーメッセージ
      additionalProperties:
        type: array
        items:
          type: string
      example:
        upload: [画像サイズは5MB以下にしてください]

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: alice
        email:
          type: string
          format: email
          example: alice@example.com

    Snap:
      type: object
      properties:
        id:
          type: integer
          example: 1
        file:
          type: integer
          description: File の ID
          example: 1
        filePath:
          type: string
          description: MEDIA_URL（/media/）からの相対パス
          example: uploads/photo_20260930120000.png
        comment:
          type: string
          nullable: true
          example: 思い出の一枚
        created_at:
          type: string
          format: date-time
          example: "2026-09-30T12:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-30T12:00:00Z"

    SnapCreated:
      type: object
      description: 作成直後のレスポンス
      properties:
        id:
          type: integer
          example: 1
        comment:
          type: string
          nullable: true
          example: 思い出の一枚
        filePath:
          type: string
          example: uploads/photo_20260930120000.png
