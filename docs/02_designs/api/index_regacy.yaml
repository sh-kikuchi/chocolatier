openapi: 3.0.3
info:
  title: Chocolatier API
  version: 1.0.0
  description: Django + JWT を使ったスナップ共有アプリのAPI仕様

servers:
  - url: http://localhost:8000

paths:
  /admin/:
    get:
      tags:
        - Auth
      summary: 管理画面（Django Admin）
      description: Django管理画面のトップページ
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error

  /token/:
    post:
      tags:
        - Auth
      summary: アクセストークン＆リフレッシュトークン取得
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: testman
                password:
                  type: string
                  example: password001
              required:
                - username
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh:
                    type: string
                  access:
                    type: string
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /chocolatier_api/signup/:
    post:
      tags:
        - Auth
      summary: ユーザー登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: testuser
                email:
                  type: string
                  format: email
                  example: test2@example.com
                password:
                  type: string
                  format: password
                  example: TestPass123!
                user_type:
                  type: string
                  enum: [general, creator, brand]
                  example: general
                profile_info:
                  type: string
                  example: テストユーザーのプロフィールです
              required:
                - username
                - email
                - password
                - user_type
      responses:
        "201":
          description: ユーザー登録成功
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /chocolatier_api/snap/:
    get:
      tags:
        - Snap
      summary: スナップ一覧
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    title:
                      type: string
                      example: テストスナップ
                    image_url:
                      type: string
                      format: uri
                      example: http://localhost:8000/media/snaps/test.jpg
                    created_at:
                      type: string
                      format: date-time
                      example: 2025-08-08T12:00:00Z
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error

  /chocolatier_api/snap/register:
    post:
      tags:
        - Snap
      summary: スナップ新規登録
      description: 新しいスナップを作成する。JWT認証が必要。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                image:
                  type: string
              required:
                - title
                - image
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /chocolatier_api/snap/{id}:
    get:
      tags:
        - Snap
      summary: スナップ詳細取得
      description: 指定したIDのスナップ詳細を取得する。JWT認証が必要。ファイルテーブルからファイルパスも取得する。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error

    delete:
      tags:
        - Snap
      summary: スナップ削除
      description: 指定したIDのスナップを削除する。JWT認証が必要。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: 削除成功
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error

  /chocolatier_api/snap/update:
    put:
      tags:
        - Snap
      summary: スナップ更新
      description: スナップ情報を更新する。JWT認証が必要。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                image:
                  type: string
              required:
                - id
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error

  /chocolatier_api/file/register:
    post:
      tags:
        - File
      summary: ファイル新規登録
      description: 新しいファイル情報を作成する。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                path:
                  type: string
              required:
                - id
      responses:
        "201":
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error

  /chocolatier_api/file/delete:
    delete:
      tags:
        - File
      summary: ファイル削除
      description: 指定したIDのファイルを削除する。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: 削除成功
        "401":
          description: Unauthorized
        "404":
          description: Not Found
        "500":
          description: Internal Server Error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

